name: screen_mirror
description: >-
  App-local Vidyut plugin that captures the phone screen with
  MediaProjection, encodes it as H.264 and streams sealed records to the
  laptop relay (ADR 0030).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.snehit.vidyut.screen_mirror
        pluginClass: ScreenMirrorPlugin
