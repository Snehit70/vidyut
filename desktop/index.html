<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="light dark"/>
  <title>Vidyut</title>
  <style>
    /* Boot page only. It is on screen for a moment before the shell navigates
     * to the Relay's loopback control plane, which serves the real UI with
     * Manrope packaged in. This page cannot link that font, so it uses the
     * system stack rather than naming a family it never loads.
     * Tokens mirror design/tokens.css. */
    :root {
      --surface-page: #FFFFFF;
      --surface-card: #FDF0F4;
      --raspberry: #C83861;
      --ink: #33202B;
      --muted: #856774;
      --hairline: #9D878F;
      --radius-card: 16px;
      --radius-control: 12px;
      --control-height: 48px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface-page: #171116;
        --surface-card: #241A20;
        --raspberry: #FFB1C3;
        --ink: #F8EAF0;
        --muted: #D4B8C4;
        --hairline: #805F6C;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      min-height: 100vh;
      background: var(--surface-page);
      color: var(--ink);
    }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.35;
    }
    main { max-width: 22rem; padding: 24px; text-align: center; }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }
    p { margin: 0; color: var(--muted); }
    .dot {
      width: 10px;
      height: 10px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: var(--raspberry);
      animation: pulse 1400ms ease-out infinite;
    }
    button {
      margin-top: 20px;
      min-height: var(--control-height);
      padding: 0 24px;
      border: 1px solid var(--hairline);
      border-radius: var(--radius-control);
      background: var(--surface-card);
      color: var(--raspberry);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 1.5px solid var(--raspberry); outline-offset: 2px; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--raspberry) 30%, transparent); }
      100% { box-shadow: 0 0 0 12px transparent; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Vidyut</h1>
    <p id="status" role="status" aria-live="polite">Starting the Relay. Closing this window does not stop it.</p>
    <button type="button" id="start-relay">Start relay</button>
  </main>
  <script>
    const status = document.getElementById("status");
    const start = document.getElementById("start-relay");
    let ui = "http://127.0.0.1:17321/";

    function invoke(cmd) {
      const core = window.__TAURI__ && window.__TAURI__.core;
      if (!core || typeof core.invoke !== "function") {
        return Promise.reject(new Error("desktop shell"));
      }
      return core.invoke(cmd);
    }

    async function loadUi() {
      try {
        const next = await invoke("relay_ui");
        if (typeof next === "string" && next.indexOf("http://127.0.0.1:") === 0) {
          ui = next;
        }
      } catch (err) {
        /* keep the default port */
      }
    }

    async function relayUp() {
      try {
        const response = await fetch(new URL("health", ui).href, { cache: "no-store" });
        return response.ok;
      } catch (err) {
        return false;
      }
    }

    async function openUi() {
      if (await relayUp()) {
        location.replace(ui);
        return true;
      }
      return false;
    }

    start.addEventListener("click", async function () {
      status.textContent = "Starting the Relay.";
      await loadUi();
      try {
        await invoke("start_relay");
      } catch (err) {
        status.textContent = "The Relay did not start. Install the systemd user unit, then try again.";
        return;
      }
      if (!(await openUi())) {
        status.textContent = "The Relay did not answer on " + ui.replace(/^http:\/\//, "").replace(/\/$/, "") + ".";
      }
    });

    (async function boot() {
      await loadUi();
      if (await openUi()) return;
      try { await invoke("start_relay"); } catch (err) { /* keep polling */ }
      for (let i = 0; i < 40; i++) {
        if (await openUi()) return;
        await new Promise(function (ok) { setTimeout(ok, 250); });
      }
      status.textContent = "The Relay is not answering. Start relay uses the systemd user unit.";
    })();
  </script>
</body>
</html>
